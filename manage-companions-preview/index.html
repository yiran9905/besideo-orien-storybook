<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Besideo · Manage companions</title>
<style>
  :root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#3d2a1f; background:#f0e2d3; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; }
  button,input,textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid #9f5c27; outline-offset:3px; }
  .app { width:min(100%,402px); margin:auto; min-height:100svh; padding:18px 21px 28px; background:#f8eee3; }
  .status { display:block; width:100%; height:30px; object-fit:cover; object-position:center; margin-bottom:15px; }
  header { display:flex; align-items:center; gap:7px; margin:0 0 10px; }
  header button { display:grid; place-items:center; width:42px; height:44px; flex:none; border:0; background:none; font-size:36px; line-height:.8; padding:0 0 5px; }
  h1 { font-size:24px; letter-spacing:-.026em; margin:0; }
  .switcher { display:grid; grid-template-columns:minmax(0,1fr) 58px; align-items:start; gap:11px; padding:0 5px 5px; }
  .pet-rail { display:flex; justify-content:flex-start; overflow-x:auto; scrollbar-width:none; gap:10px; padding:4px 3px 11px; scroll-padding:3px; }
  .pet-rail.few { justify-content:center; gap:28px; }
  .pet-tab,.add-slot { width:56px; height:56px; flex:none; border-radius:50%; display:grid; place-items:center; padding:0; position:relative; }
  .pet-tab { border:2px solid #fffdfa; background:#ffe5c3; }
  .pet-tab img { width:100%; height:100%; min-height:0; object-fit:cover; border-radius:50%; }
  .pet-tab[aria-current="true"] { border:3px solid #f7a34d; }
  .pet-tab[aria-current="true"]::after { content:""; position:absolute; top:calc(100% + 5px); left:50%; transform:translateX(-50%); border:6px solid transparent; border-top:7px solid #f7a34d; border-bottom:0; }
  .pet-tab.pending { border:1.5px solid #b28457; background:#fff9eb; font-size:23px; color:#8a603d; }
  .monogram { font-family:Georgia,serif; font-size:26px; color:#815330; }
  .add-slot { margin:4px 0 0; background:none; border:2px dashed #a67f60; color:#b25a24; font-size:30px; font-weight:300; }
  .profile { position:relative; isolation:isolate; min-height:226px; padding:20px 17px 17px; border-radius:22px; background:linear-gradient(135deg,#fff7e2,#fff4dc 70%,#fbf2d9); box-shadow:0 2px 6px #59472b32; overflow:hidden; }
  .profile::before,.profile::after { content:""; position:absolute; z-index:-1; width:160px; height:111px; border-radius:66% 34% 53% 47%; }
  .profile::before { right:-32px; top:-56px; background:#d9d7aa; transform:rotate(18deg); }
  .profile::after { left:-43px; bottom:-69px; background:#fbdfb8; transform:rotate(19deg); }
  .profile-photo { display:grid; place-items:center; aspect-ratio:130/151; border-radius:11px; overflow:hidden; background:#f7dcba; }
  .profile-photo img { width:100%; height:100%; object-fit:cover; }
  .profile-photo .monogram { font-size:50px; }
  .profile-grid { display:grid; grid-template-columns:41% minmax(0,1fr); align-items:stretch; gap:15px; }
  .facts { margin:0; display:grid; align-content:space-between; min-width:0; }
  .facts label, .facts .fact { display:block; border-bottom:1px dashed #b39875; padding-bottom:4px; }
  .facts label span,.facts .fact span { display:block; font-size:12px; font-weight:650; color:#76593d; padding-bottom:3px; }
  .facts input,.facts strong { display:block; width:100%; border:0; background:none; padding:0; font-size:15px; font-weight:650; }
  .facts input[name="name"] { font-size:20px; font-weight:750; }
  .traits { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:5px; margin-top:12px; }
  .traits span { padding:5px 7px; border-radius:2px; font-size:10px; font-weight:700; background:#f8d7f2; box-shadow:0 2px 2px #38281015; }
  .traits span:nth-child(2) { background:#d4e8ff; }
  .traits span:nth-child(3) { background:#d2f2c6; }
  .private { margin-top:35px; }
  .private h2 { font-size:20px; margin:0 0 14px; }
  .private label { display:flex; min-height:34px; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid #efbc8b; font-size:12px; color:#76593d; padding:0 9px; }
  .private input { min-width:0; width:52%; border:0; text-align:right; background:transparent; font-weight:650; color:#3d2a1f; padding:7px 0; }
  .private .memory { display:block; border:0; padding-top:9px; }
  .private textarea { display:block; width:100%; min-height:112px; margin-top:6px; padding:14px 17px; border:1px solid #e9b17a; border-radius:16px; background:#fffefc; color:#3d2a1f; font-size:14px; resize:vertical; }
  .actions { display:grid; place-items:center; margin:18px 0 0; }
  .primary { border:0; border-radius:30px; background:#f6a651; color:#402b1b; font-size:16px; font-weight:750; min-height:46px; padding:8px 25px; }
  .save { min-width:118px; }
  .toast { min-height:17px; margin-top:9px; color:#76593d; font-size:12px; }
  dialog { max-height:85svh; width:min(calc(100% - 28px),370px); border:1px solid #fff9eb; border-radius:24px; padding:22px; background:#fff7e9; color:#3d2a1f; box-shadow:0 22px 68px #52351c55; }
  dialog::backdrop { background:#37281b65; }
  dialog h2 { font-size:22px; letter-spacing:-.025em; margin:10px 0 7px; }
  dialog p { font-size:14px; line-height:1.5; margin:0 0 16px; color:#655040; }
  .gem { display:inline-block; width:36px; aspect-ratio:1; clip-path:polygon(25% 11%,70% 8%,98% 41%,73% 67%,48% 95%,19% 73%,2% 42%); background:linear-gradient(143deg,#fff6d3 12%,#f3afd0 29%,#f9e9a6 47%,#a3dcdd 63%,#cbcafa 83%); }
  .slot-cost { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-block:1px solid #ead5b9; color:#6e533a; font-size:13px; margin:0 0 10px; }
  .slot-cost strong { font-size:13px; color:#523922; }
  .hint { font-size:12px; color:#76593d; margin:0 0 12px; }
  .dialog-actions { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:16px; }
  .secondary { border:0; background:none; min-height:44px; padding:7px 13px; font-size:13px; font-weight:650; }
  .new-name { display:block; margin-top:10px; font-size:13px; font-weight:650; }
  .new-name input { width:100%; min-height:43px; padding:8px 12px; margin-top:5px; border:1px solid #d7ac82; border-radius:12px; background:#fffdfa; }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation:rise .18s ease-out; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  }
</style>

  </form>
</dialog>
<script id="slot-model">
function makeSlots(slots) {
  let nextId = slots.reduce((max,slot) => Math.max(max,slot.id),0) + 1;
  return {
    slots,
    unlock() {
      const slot = {id:nextId++,name:null};
      slots.push(slot);
      return slot;
    },
    add(id,name) {
      const clean = name.trim();
      const slot = slots.find(item=>item.id===id);
      if (!clean || !slot || slot.name !== null) return false;
      slot.name = clean;
      return true;
    }
  };
}
</script>

  const storageKey = 'besideo-companion-slot-preview-v1';
  function restore() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved) && saved.length >= 2 &&
          saved.every(slot=>Number.isInteger(slot?.id) && (slot.name===null || typeof slot.name==='string')) &&
          new Set(saved.map(slot=>slot.id)).size === saved.length) return saved;
    } catch {}
    return samples.map(({image,avatar,...slot})=>slot);
  }
  const model = makeSlots(restore());
  const rail = document.querySelector('#pet-rail');
  const dialog = document.querySelector('#slot-dialog');
  const unlockPanel = document.querySelector('#unlock-panel');
  const newPanel = document.querySelector('#new-panel');
  const newName = document.querySelector('#new-name');
  const form = document.querySelector('#profile-form');
  const toast = document.querySelector('#toast');
  const addSlot = document.querySelector('#add-slot');
  let current = model.slots.find(slot=>slot.name!==null)?.id ?? model.slots[0].id;
  let activeSlot = null;
  let dialogOpener = null;

  function saveState() {
    try { localStorage.setItem(storageKey,JSON.stringify(model.slots)); } catch {}
  }

  function portrait(slot, size) {
    const photo = samples.find(sample=>sample.id===slot.id)?.[size];
    if (photo) {
      const image = document.createElement('img');
      image.src = photo;
      image.alt = '';
      return image;
    }
    const label = document.createElement('span');
    label.className = 'monogram';
    label.textContent = slot.name ? Array.from(slot.name)[0].toUpperCase() : '+';
    return label;
  }

  function renderRail(scrollId) {
    rail.classList.toggle('few', model.slots.length <= 2);
    const offset = rail.scrollLeft;
    const tabs = model.slots.map(slot => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = slot.name===null ? 'pet-tab pending' : 'pet-tab';
      button.setAttribute('aria-label', slot.name ?? ('Add companion to unlocked slot ' + slot.id));
      button.setAttribute('aria-current', String(slot.id===current));
      button.append(portrait(slot,'avatar'));
      button.addEventListener('click', () => {
        if (slot.name === null) {
          dialogOpener = button;
          openAdd(slot.id);
          return;
        }
        current = slot.id;
        Array.from(rail.children).forEach(tab=>tab.setAttribute('aria-current', String(tab===button)));
        renderProfile();
      });
      return button;
    });
    rail.replaceChildren(...tabs);
    rail.scrollLeft = scrollId ? rail.scrollWidth - rail.clientWidth : offset;
  }

  function renderProfile() {
    const slot = model.slots.find(item=>item.id===current);
    for (const key of ['name','gender','birthday','farewell','relationship','memory']) form.elements[key].value = slot[key] ?? '';
    document.querySelector('#profile-photo').replaceChildren(portrait(slot,'image'));
    document.querySelector('#joined').textContent = slot.joined ?? '—';
    document.querySelector('#traits').replaceChildren(...(slot.traits ?? []).map(trait=>{
      const label = document.createElement('span');
      label.textContent = trait;
      return label;
    }));
    toast.textContent='';
  }

  function openAdd(id) {
    activeSlot = id;
    unlockPanel.hidden = true;
    newPanel.hidden = false;
    newName.value = '';
    if (!dialog.open) dialog.showModal();
    newName.focus({preventScroll:true});
  }

  addSlot.addEventListener('click',()=>{
    dialogOpener = addSlot;
    activeSlot = null;
    unlockPanel.hidden = false;
    newPanel.hidden = true;
    dialog.showModal();
  });
  document.querySelector('#confirm-unlock').addEventListener('click',()=>{
    if (unlockPanel.hidden || !dialog.open) return;
    const slot = model.unlock();
    saveState();
    renderRail(slot.id);
    openAdd(slot.id);
  });
  newPanel.addEventListener('submit',event=>{
    event.preventDefault();
    if (!model.add(activeSlot,newName.value)) return;
    current = activeSlot;
    saveState();
    renderRail(activeSlot);
    renderProfile();
    dialog.close();
    toast.textContent='Companion added';
  });
  dialog.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>dialog.close()));
  dialog.addEventListener('close',()=>{
    activeSlot = null;
    (dialogOpener?.isConnected ? dialogOpener : addSlot).focus({preventScroll:true});
  });
  form.addEventListener('submit',event=>{
    event.preventDefault();
    const data = new FormData(form);
    if (!data.get('name').trim()) {
      form.elements.name.focus();
      return;
    }
    const slot = model.slots.find(item=>item.id===current);
    for (const [key,value] of data) slot[key]=value.trim();
    saveState();
    renderRail();
    renderProfile();
    toast.textContent='Saved';
  });
  document.querySelector('#back').addEventListener('click',()=>{ if (history.length>1) history.back(); });
  renderRail();
  renderProfile();
})();
</script>
