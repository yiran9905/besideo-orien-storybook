  .picker { position: absolute; inset: auto 3% 12.4%; color: #fff9ec; }
  .picker::before {
    position: absolute;
    inset: -14px -3.2% -10px;
    z-index: -1;
    content: "";
    background: radial-gradient(ellipse at 50% 65%, #29291d93, transparent 73%);
    pointer-events: none;
  }
  .picker { animation:picker-in .16s ease-out both; }
  .pet-page {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:start;
    padding-top:6px;
  }
  @keyframes picker-in { from { opacity:0; transform:translateY(6px); } }
  @media (prefers-reduced-motion:reduce) { .picker { animation:none; } }
  .pet-avatar {
    display: grid;
    justify-items: center;
    gap: 3px;
    width: 100%;
    min-height: 55px;
    padding: 0 2px 2px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .pet-avatar:is(:first-child,:last-child) { margin-top: clamp(12px,6cqw,22px); }
  .pet-avatar img {
    display: block;
    box-sizing: border-box;
    width: clamp(36px, 13cqw, 54px);
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #fffcef;
    box-shadow: 0 2px 8px #19180e72;
    pointer-events: none;
  }
  .pet-avatar[data-selected="true"] img { border: 3px solid #e7bb57; }
  .pet-avatar span,
  .page-status {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 2px 7px;
    border-radius: 20px;
    color: #fff9ec;
    background: #403b26d5;
    font-size: 11px;
    line-height: 1.25;
    font-weight: 650;
  }
  .pager {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 36px;
  }
  .pager button {
    width: 44px;
    height: 42px;
    border: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font-size: 25px;
    line-height: 1;
    text-shadow: 0 1px 4px #15130a;
    cursor: pointer;
  }
  .pager button:disabled { opacity: .38; cursor: default; }
  .page-status { padding: 4px 9px; font-variant-numeric: tabular-nums; }
  .paw {
    position: absolute;
    inset: auto auto 2.6% 37.5%;
    width: 25%;
    height: 9.8%;
    min-height: 42px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #ffe5a0; outline-offset: -2px; }
  .result {
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    padding: 7px 12px;
    border-radius: 20px;
    color: #fff9ec;
    background: #403b26ea;
    font-size: 13px;
    white-space: nowrap;
  }
</style>

  const root = document.getElementById('portrait-swipe');
  const picker = root.querySelector('.picker');
  const avatars = root.querySelector('.pet-page');
  const paw = root.querySelector('.paw');
  const result = root.querySelector('.result');
  const status = root.querySelector('.page-status');
  const previous = root.querySelector('.previous');
  const next = root.querySelector('.next');
  const perPage = 4;
  const pageCount = Math.ceil(pets.length / perPage);
  let page = 0;
  let selected = pets[0].name;

  function setOpen(open) {
    picker.hidden = !open;
    paw.setAttribute('aria-expanded', String(open));
    result.hidden = true;
    if (open) renderPage();
  }

  function renderPage() {
    const start = page * perPage;
    avatars.replaceChildren(...pets.slice(start,start + perPage).map(pet => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pet-avatar';
      button.dataset.selected = String(pet.name === selected);
      button.setAttribute('aria-label', 'Open ' + pet.name + '’s Portrait');
      const photo = document.createElement('img');
      photo.alt = '';
      photo.src = pet.image;
      photo.draggable = false;
      const label = document.createElement('span');
      label.textContent = pet.name;
      button.append(photo,label);
      button.addEventListener('click',() => {
        selected = pet.name;
        setOpen(false);
        result.textContent = pet.name + ' · Portrait';
        result.hidden = false;
        paw.focus({preventScroll:true});
      });
      return button;
    }));
    status.textContent = (page + 1) + ' / ' + pageCount;
    previous.disabled = page === 0;
    next.disabled = page === pageCount - 1;
  }

  function turn(step) {
    const nextPage = page + step;
    if (nextPage < 0 || nextPage >= pageCount) return;
    page = nextPage;
    renderPage();
  }

  paw.addEventListener('click',() => setOpen(picker.hidden));
  previous.addEventListener('click',() => turn(-1));
  next.addEventListener('click',() => turn(1));
  document.addEventListener('keydown',event => {
    if (event.key !== 'Escape' || picker.hidden) return;
    setOpen(false);
    paw.focus({preventScroll:true});
  });
  renderPage();
})();
</script>
