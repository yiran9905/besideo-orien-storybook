  const ring = root.querySelector('.pd-ring');
  const dial = root.querySelector('.pd-dial');
  const paw = root.querySelector('.pd-paw');
  const spoke = root.querySelector('.pd-spoke');
  const counter = root.querySelector('[role="status"]');
  const result = root.querySelector('.pd-result');
  const avatars = root.querySelector('.pd-avatars');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const wrap = n => ((n % pets.length) + pets.length) % pets.length;
  const slotAngle = Math.PI * .345;
  let center = 1;
  let position = center;
  let lastVisited = -1;
  let frame = 0;
  let drag = null;
  let suppressClick = false;

  const buttons = pets.map((pet, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pd-avatar cursor-interaction';
    button.setAttribute('aria-label', '进入 ' + pet.name + ' 的 Portrait');
    button.setAttribute('data-tooltip', pet.name);
    const img = document.createElement('img');
    img.src = pet.image;
    img.alt = '';
    img.draggable = false;
    button.append(img);
    button.addEventListener('click', () => {
      cancelAnimationFrame(frame);
      lastVisited = center = position = index;
      update();
      setOpen(false);
      result.textContent = pet.name + ' · Portrait';
      result.hidden = false;
      paw.focus({preventScroll:true});
    });
    avatars.append(button);
    return button;
  });

  function update() {
    let highlightAngle = 0;
    let highlightOpacity = 0;
    buttons.forEach((button, index) => {
      const relative = wrap(index - position + pets.length / 2) - pets.length / 2;
      const angle = relative * slotAngle;
      const visibility = Math.min(1, Math.max(0, (1.58 - Math.abs(relative)) / 0.52));
      button.hidden = visibility === 0;
      button.style.transform = 'translate(calc(-50% + ' + (Math.sin(angle) * 19.6) + 'cqw), calc(50% - ' + (Math.cos(angle) * 19.6) + 'cqw))';
      button.style.opacity = visibility;
      button.style.pointerEvents = visibility < .68 ? 'none' : '';
      button.tabIndex = visibility < .68 ? -1 : 0;
      const highlighted = index === lastVisited;
      button.dataset.centered = String(highlighted);
      if (highlighted) {
        highlightAngle = angle;
        highlightOpacity = visibility;
      }
    });
    spoke.style.transform = 'rotate(' + highlightAngle + 'rad)';
    spoke.style.opacity = highlightOpacity;
  }

  function announceCenter() {
    counter.textContent = pets[wrap(center)].name;
  }

  function setOpen(open) {
    dial.hidden = !open;
    result.hidden = true;
    paw.setAttribute('aria-expanded', String(open));
  }

  function settle(target) {
    cancelAnimationFrame(frame);
    center = target;
    announceCenter();
    if (reducedMotion.matches || target === position) {
      center = position = wrap(target);
      update();
      return;
    }
    const start = position;
    const started = performance.now();
    function animate(now) {
      const t = Math.min((now - started) / 185, 1);
      position = start + (target - start) * (1 - (1 - t) ** 3);
      update();
      if (t < 1) frame = requestAnimationFrame(animate);
      else center = position = wrap(target);
    }
    frame = requestAnimationFrame(animate);
  }

  paw.addEventListener('click', () => setOpen(dial.hidden));
  function polar(event, geometry) {
    const x = event.clientX - geometry.x;
    const y = event.clientY - geometry.y;
    return {angle: Math.atan2(y, x), radius: Math.hypot(x, y)};
  }

  dial.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0) return;
    const rect = ring.getBoundingClientRect();
    const geometry = {x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, radius: rect.width / 2};
    const point = polar(event, geometry);
    const onAvatar = event.target.closest('.pd-avatar');
    if (!onAvatar && (point.radius < geometry.radius * .68 || point.radius > geometry.radius * 1.36)) return;

    cancelAnimationFrame(frame);
    suppressClick = false;
    drag = {id: event.pointerId, geometry, angle: point.angle, active: false, pending: 0};
    if (!onAvatar) dial.setPointerCapture(event.pointerId);
  });

  dial.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    const point = polar(event, drag.geometry);
    if (point.radius < drag.geometry.radius * .43) {
      drag.angle = null;
      return;
    }

    // Accumulate the shortest angular change so crossing the angle discontinuity does not jump.
    const delta = point.angle - (drag.angle ?? point.angle);
    drag.angle = point.angle;
    drag.pending += Math.atan2(Math.sin(delta), Math.cos(delta));
    if (!drag.active && Math.abs(drag.pending) < .12) return;
    if (!drag.active) {
      drag.active = true;
      dial.setPointerCapture(event.pointerId);
    }
    position -= drag.pending / slotAngle;
    drag.pending = 0;
    update();
  });

  function release(event) {
    if (!drag || event.pointerId !== drag.id) return;
    const wasActive = drag.active;
    drag = null;
    suppressClick = wasActive;
    settle(Math.round(position));
  }
  dial.addEventListener('pointerup', release);
  dial.addEventListener('pointercancel', release);
  dial.addEventListener('lostpointercapture', release);
  dial.addEventListener('click', event => {
    if (suppressClick && event.detail !== 0) {
      event.stopPropagation();
      suppressClick = false;
    }
  }, true);
  dial.addEventListener('keydown', event => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    settle(center + (event.key === 'ArrowRight' ? 1 : -1));
    if (event.target.classList.contains('pd-avatar')) buttons[wrap(center)].focus({preventScroll:true});
  });

  update();
  announceCenter();
})();
